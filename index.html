<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#8a4fff" />
<title>Zing-o-Matic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d0820;
    color: #f0e9ff;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  body {
    background:
      radial-gradient(circle at 20% 10%, rgba(255,79,139,0.35), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(79,195,255,0.30), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(138,79,255,0.25), transparent 60%),
      #0d0820;
  }
  #app {
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
  }
  header {
    text-align: center;
    padding: 12px 0 6px;
    position: relative;
  }
  header h1 {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff4f8b, #ffd84a, #4fc3ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { font-size: 11px; opacity: 0.6; margin-top: 2px; }

  main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 2px 90px;
  }
  main::-webkit-scrollbar { display: none; }

  section.card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 10px 12px;
    backdrop-filter: blur(10px);
  }
  .row-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    opacity: 0.6;
    text-transform: uppercase;
  }
  .lang-toggle {
    display: flex;
    gap: 4px;
    background: rgba(0,0,0,0.3);
    border-radius: 999px;
    padding: 3px;
  }
  .lang-toggle button {
    background: transparent;
    border: none;
    color: #f0e9ff;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .lang-toggle button.active {
    background: linear-gradient(90deg, #ff4f8b, #8a4fff);
    box-shadow: 0 2px 8px rgba(138, 79, 255, 0.4);
  }

  .h-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
    margin: 0 -4px;
    padding-left: 4px;
    padding-right: 4px;
  }
  .h-scroll::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid transparent;
    color: #f0e9ff;
    border-radius: 12px;
    padding: 9px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 110px;
    transition: all 0.15s ease;
  }
  .chip:active { transform: scale(0.95); }
  .chip.active {
    background: linear-gradient(135deg, #ff4f8b, #8a4fff);
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 6px 18px rgba(138,79,255,0.45);
  }
  .chip .emoji { font-size: 20px; }
  .chip .meta { font-size: 10px; opacity: 0.75; font-weight: 500; }

  .mode-tabs {
    display: flex;
    gap: 4px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 10px;
  }
  .mode-tabs button {
    flex: 1;
    background: transparent;
    border: none;
    color: #f0e9ff;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .mode-tabs button.active {
    background: linear-gradient(90deg, #ff4f8b, #8a4fff);
    box-shadow: 0 2px 8px rgba(138, 79, 255, 0.4);
  }

  textarea, input[type="text"] {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #f0e9ff;
    padding: 11px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    line-height: 1.4;
  }
  textarea { min-height: 90px; }
  textarea:focus, input[type="text"]:focus {
    outline: none;
    border-color: #ff4f8b;
    box-shadow: 0 0 0 2px rgba(255,79,139,0.2);
  }

  .row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .preset {
    flex: 1 1 auto;
    background: rgba(255,255,255,0.08);
    border: none;
    color: #f0e9ff;
    padding: 7px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .preset:active { transform: scale(0.95); }

  .gen-btn {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #4fc3ff, #8a4fff);
    color: white;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(79, 195, 255, 0.35);
  }
  .gen-btn:active { transform: scale(0.97); }

  .stage {
    background: linear-gradient(180deg, rgba(255,79,139,0.12), rgba(79,195,255,0.12));
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .stage .who {
    font-size: 13px;
    font-weight: 700;
    opacity: 0.85;
  }
  .stage .who .small { font-size: 10px; opacity: 0.7; font-weight: 500; }
  .lyric {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.35;
    min-height: 22px;
    max-height: 80px;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .lyric::-webkit-scrollbar { display: none; }
  .lyric .syl {
    display: inline-block;
    transition: transform 0.15s ease, color 0.15s ease;
    margin: 0 1px;
  }
  .lyric .syl.on {
    color: #ffd84a;
    transform: translateY(-5px) scale(1.15);
    text-shadow: 0 4px 14px rgba(255,216,74,0.6);
  }

  .bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 26px;
  }
  .bar {
    width: 4px;
    background: linear-gradient(180deg, #ff4f8b, #4fc3ff);
    border-radius: 2px;
    height: 4px;
    transition: height 0.1s ease;
  }
  .bars.on .bar { animation: dance 0.6s infinite alternate; }
  .bars.on .bar:nth-child(2) { animation-delay: 0.1s; }
  .bars.on .bar:nth-child(3) { animation-delay: 0.2s; }
  .bars.on .bar:nth-child(4) { animation-delay: 0.05s; }
  .bars.on .bar:nth-child(5) { animation-delay: 0.15s; }
  @keyframes dance { to { height: 24px; } }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, #0d0820 40%);
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  footer > * { pointer-events: auto; }
  footer .inner {
    width: 100%;
    max-width: 456px;
    display: flex;
    gap: 8px;
  }
  .btn {
    border: none;
    color: white;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: 800;
    border-radius: 999px;
    cursor: pointer;
    flex: 1;
    box-shadow: 0 8px 22px rgba(138, 79, 255, 0.45);
    transition: transform 0.12s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn.sing { background: linear-gradient(90deg, #ff4f8b, #8a4fff); }
  .btn.stop {
    background: rgba(255,255,255,0.1);
    color: #f0e9ff;
    box-shadow: none;
    flex: 0 0 70px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .toast {
    position: fixed;
    bottom: 84px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    color: #0d0820;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    text-align: center;
  }
  .toast.show { opacity: 1; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎤 ZING-O-MATIC</h1>
    <p>Kies artiest, taal, genre & tekst</p>
  </header>

  <main>
    <section class="card">
      <div class="row-head">
        <span class="label">Taal</span>
        <div class="lang-toggle" id="langToggle">
          <button data-lang="nl" class="active">🇳🇱 Nederlands</button>
          <button data-lang="en">🇬🇧 English</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="label">1. Artiest</div>
      <div class="h-scroll" id="artists"></div>
    </section>

    <section class="card">
      <div class="label">2. Genre</div>
      <div class="h-scroll" id="genres"></div>
    </section>

    <section class="card">
      <div class="label">3. Tekst</div>
      <div class="mode-tabs" id="modeTabs">
        <button data-mode="exact" class="active">📝 Exacte tekst</button>
        <button data-mode="prompt">✨ Genereer uit prompt</button>
      </div>

      <div id="exactPanel">
        <textarea id="lyrics" placeholder="Schrijf hier de exacte songtekst..." maxlength="500">De zon schijnt door het raam, ik zing een lied voor jou</textarea>
        <div class="row" id="presetRow"></div>
      </div>

      <div id="promptPanel" class="hidden">
        <input type="text" id="prompt" placeholder="bijv. een liefdesliedje over de zomer" maxlength="120" />
        <button class="gen-btn" id="genBtn">✨ Genereer lyrics</button>
        <textarea id="generatedLyrics" placeholder="Gegenereerde tekst verschijnt hier — je mag aanpassen" maxlength="500"></textarea>
      </div>
    </section>

    <section class="stage">
      <div class="who" id="who">Selecteer een artiest & genre</div>
      <div class="lyric" id="lyric">🎶 ... 🎶</div>
      <div class="bars" id="bars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="inner">
      <button class="btn sing" id="singBtn">🎤 Laat zingen</button>
      <button class="btn stop" id="stopBtn">⏹</button>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
</div>

  function detectTheme(prompt) {
    const p = prompt.toLowerCase();
    const map = [
      ['liefde', /liefde|hart|kus|romant|verliefd|samen|love|heart|kiss|romant/],
      ['zomer',  /zomer|zon|strand|vakantie|warm|summer|sun|beach|holiday/],
      ['verdriet', /verdriet|traan|tranen|verloren|gemist|alleen|sad|cry|tears|miss|lonely|broken/],
      ['feest',  /feest|dans|party|club|nacht uit|dance|celebrate/],
      ['vrijheid', /vrij|reis|weg|free|road|adventure|escape/],
      ['nacht',  /nacht|maan|donker|sterren|night|moon|dark|stars/],
    ];
    for (const [theme, re] of map) {
      if (re.test(p)) return theme;
    }
    return null;
  }

  function generateLyrics(prompt, lang) {
    const themes = Object.keys(verses[lang]);
    const theme = detectTheme(prompt) || themes[Math.floor(Math.random() * themes.length)];
    const pool = verses[lang][theme];
    const a = pool[Math.floor(Math.random() * pool.length)];
    let b;
    do { b = pool[Math.floor(Math.random() * pool.length)]; } while (b === a && pool.length > 1);
    return [...a, ...b].join('\n');
  }

  // ---------- PRESETS ----------
  const presets = {
    nl: [
      { label: '☀️ Zonnig', text: 'De zon schijnt door het raam, ik zing een lied voor jou' },
      { label: '💔 Verdriet', text: 'Tranen vallen in de regen, mijn hart is leeg vannacht' },
      { label: '🎧 Stoer',   text: 'Yo, check de beat, ik ben de baas in de game' },
      { label: '🪩 Feest',   text: 'Dansen tot de zon opkomt, vannacht is van ons' },
    ],
    en: [
      { label: '☀️ Sunny',   text: 'The sun is shining through my window, singing a song for you' },
      { label: '💔 Sad',     text: 'Tears are falling in the rain, my heart is empty tonight' },
      { label: '🎧 Tough',   text: 'Yo, check the beat, I am the boss of this game' },
      { label: '🪩 Party',   text: 'Dancing till the sun comes up, tonight belongs to us' },
    ],
  };

  // ---------- STATE ----------
  let language = 'nl';
  let mode = 'exact';
  let selectedArtist = artists[0];
  let selectedGenre = genres[0];
  let voices = [];
  let isSinging = false;

  // ---------- VOICES ----------
  function loadVoices() { voices = window.speechSynthesis.getVoices(); }
  if (typeof speechSynthesis !== 'undefined') {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoice(artist, langCode) {
    if (!voices.length) return null;
    const langPrefix = langCode.split('-')[0];
    const sameLang = voices.filter(v => v.lang.startsWith(langPrefix));
    const exactLang = voices.filter(v => v.lang === langCode);
    const pool = exactLang.length ? exactLang : (sameLang.length ? sameLang : voices);

    // 1) Try artist-specific name hints in the chosen language pool.
    for (const hint of artist.hints) {
      const m = pool.find(v => v.name.toLowerCase().includes(hint));
      if (m) return m;
    }
    // 2) Fall back to a gender-matching voice.
    const genderHints = artist.gender === 'female'
      ? ['female', 'samantha', 'ava', 'allison', 'susan', 'karen', 'kate', 'serena',
         'fiona', 'moira', 'tessa', 'victoria', 'martha', 'nicky', 'claire', 'ellen']
      : ['male', 'daniel', 'alex', 'fred', 'aaron', 'arthur', 'oliver', 'thomas',
         'rocko', 'ralph', 'reed', 'evan', 'tom', 'martin', 'xander'];
    const g = pool.find(v => genderHints.some(h => v.name.toLowerCase().includes(h)));
    if (g) return g;
    // 3) Anything in the right language.
    return pool[0] || voices[0];
  }

  // ---------- DOM ----------
  const $ = (s) => document.querySelector(s);
  const artistsEl = $('#artists');
  const genresEl = $('#genres');
  const lyricsEl = $('#lyrics');
  const generatedEl = $('#generatedLyrics');
  const promptEl = $('#prompt');
  const whoEl = $('#who');
  const lyricEl = $('#lyric');
  const barsEl = $('#bars');
  const presetRow = $('#presetRow');

  function renderArtists() {
    artistsEl.innerHTML = '';
    artists.forEach(a => {
      const c = document.createElement('button');
      c.className = 'chip' + (a.id === selectedArtist.id ? ' active' : '');
      c.innerHTML = `<span class="emoji">${a.emoji}</span><div><div>${a.name}</div><div class="meta">${a.meta}</div></div>`;
      c.onclick = () => { selectedArtist = a; renderArtists(); updateWho(); };
      artistsEl.appendChild(c);
    });
  }

  function renderGenres() {
    genresEl.innerHTML = '';
    genres.forEach(g => {
      const c = document.createElement('button');
      c.className = 'chip' + (g.id === selectedGenre.id ? ' active' : '');
      c.innerHTML = `<span class="emoji">${g.emoji}</span><div><div>${g.name}</div><div class="meta">${g.meta}</div></div>`;
      c.onclick = () => { selectedGenre = g; renderGenres(); updateWho(); };
      genresEl.appendChild(c);
    });
  }

  function renderPresets() {
    presetRow.innerHTML = '';
    presets[language].forEach(p => {
      const b = document.createElement('button');
      b.className = 'preset';
      b.textContent = p.label;
      b.onclick = () => { lyricsEl.value = p.text; };
      presetRow.appendChild(b);
    });
  }

  function updateWho() {
    const langLabel = language === 'nl' ? 'in 🇳🇱 NL' : 'in 🇬🇧 EN';
    whoEl.innerHTML = `${selectedArtist.emoji} <b>${selectedArtist.name}</b> <span class="small">zingt ${langLabel} —</span> ${selectedGenre.emoji} <b>${selectedGenre.name}</b>`;
  }

  function toast(m) {
    const t = $('#toast');
    t.textContent = m;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 1700);
  }

  function getActiveText() {
    return mode === 'exact' ? lyricsEl.value : generatedEl.value;
  }

  // ---------- SING ----------
  function syllabify(text) {
    const words = text.replace(/\n/g, ' ').trim().split(/\s+/);
    const result = [];
    words.forEach((w, wi) => {
      const parts = w.match(/[^aeiouyAEIOUY]*[aeiouyAEIOUY]+(?:[^aeiouyAEIOUY]*$|[^aeiouyAEIOUY](?=[^aeiouyAEIOUY]))?/g);
      const sylls = (parts && parts.length) ? parts : [w];
      sylls.forEach((s, si) => {
        result.push({ text: s, isLast: si === sylls.length - 1, wordIndex: wi });
      });
    });
    return result;
  }

  function renderLyric(syllables) {
    lyricEl.innerHTML = '';
    let lastWord = -1;
    syllables.forEach((s, i) => {
      if (s.wordIndex !== lastWord && lastWord !== -1) {
        lyricEl.appendChild(document.createTextNode(' '));
      }
      lastWord = s.wordIndex;
      const span = document.createElement('span');
      span.className = 'syl';
      span.dataset.idx = i;
      span.textContent = s.text;
      lyricEl.appendChild(span);
    });
  }

  function highlightSyllable(idx) {
    document.querySelectorAll('.syl').forEach(el => el.classList.remove('on'));
    const el = document.querySelector(`.syl[data-idx="${idx}"]`);
    if (el) {
      el.classList.add('on');
      el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
  }

  function sing() {
    if (!('speechSynthesis' in window)) { toast('Spraak niet ondersteund 😔'); return; }
    const text = getActiveText().trim();
    if (!text) { toast('Schrijf of genereer eerst een tekst!'); return; }

    speechSynthesis.cancel();
    if (!voices.length) loadVoices();

    const syllables = syllabify(text);
    if (!syllables.length) return;
    renderLyric(syllables);
    barsEl.classList.add('on');
    isSinging = true;

    const langCode = language === 'nl' ? 'nl-NL' : (selectedArtist.defaultLang.startsWith('en') ? selectedArtist.defaultLang : 'en-US');
    const voice = pickVoice(selectedArtist, langCode);
    const melody = selectedGenre.melody;
    let i = 0;

    const speakNext = () => {
      if (!isSinging || i >= syllables.length) {
        isSinging = false;
        barsEl.classList.remove('on');
        document.querySelectorAll('.syl').forEach(el => el.classList.remove('on'));
        return;
      }
      const s = syllables[i];
      const u = new SpeechSynthesisUtterance(s.text);
      if (voice) u.voice = voice;
      u.lang = langCode;
      const melodyMul = melody[i % melody.length];
      u.pitch = Math.max(0.1, Math.min(2, selectedArtist.pitch * melodyMul));
      u.rate = Math.max(0.1, Math.min(3, selectedArtist.rate * selectedGenre.rateMul));
      u.volume = 1;

      highlightSyllable(i);

      u.onend = () => {
        i++;
        const pauseMs = s.isLast ? selectedGenre.pause * 2 : selectedGenre.pause;
        setTimeout(speakNext, pauseMs);
      };
      u.onerror = () => { i++; setTimeout(speakNext, 50); };
      speechSynthesis.speak(u);
    };
    speakNext();
  }

  function stop() {
    isSinging = false;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    barsEl.classList.remove('on');
    document.querySelectorAll('.syl').forEach(el => el.classList.remove('on'));
  }

  // ---------- EVENTS ----------
  $('#singBtn').onclick = sing;
  $('#stopBtn').onclick = stop;

  document.querySelectorAll('#langToggle button').forEach(b => {
    b.onclick = () => {
      language = b.dataset.lang;
      document.querySelectorAll('#langToggle button').forEach(x => x.classList.toggle('active', x === b));
      renderPresets();
      updateWho();
    };
  });

  document.querySelectorAll('#modeTabs button').forEach(b => {
    b.onclick = () => {
      mode = b.dataset.mode;
      document.querySelectorAll('#modeTabs button').forEach(x => x.classList.toggle('active', x === b));
      $('#exactPanel').classList.toggle('hidden', mode !== 'exact');
      $('#promptPanel').classList.toggle('hidden', mode !== 'prompt');
    };
  });

  $('#genBtn').onclick = () => {
    const p = promptEl.value.trim();
    if (!p) { toast('Geef eerst een prompt op!'); return; }
    generatedEl.value = generateLyrics(p, language);
    toast('🎵 Lyrics gegenereerd!');
  };

  // ---------- INIT ----------
  renderArtists();
  renderGenres();
  renderPresets();
  updateWho();
</script>
</body>
</html>
