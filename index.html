<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#8a4fff" />
<title>Zing-o-Matic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d0820;
    color: #f0e9ff;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  body {
    background:
      radial-gradient(circle at 20% 10%, rgba(255,79,139,0.35), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(79,195,255,0.30), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(138,79,255,0.25), transparent 60%),
      #0d0820;
  }
  #app {
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
  }
  header {
    text-align: center;
    padding: 14px 0 8px;
  }
  header h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff4f8b, #ffd84a, #4fc3ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { font-size: 12px; opacity: 0.65; margin-top: 2px; }

  main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 4px 2px 80px;
  }
  main::-webkit-scrollbar { display: none; }

  section.card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 12px 14px;
    backdrop-filter: blur(10px);
  }
  .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    opacity: 0.6;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .h-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
    margin: 0 -4px;
    padding-left: 4px;
    padding-right: 4px;
  }
  .h-scroll::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid transparent;
    color: #f0e9ff;
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 110px;
    transition: all 0.15s ease;
  }
  .chip:active { transform: scale(0.95); }
  .chip.active {
    background: linear-gradient(135deg, #ff4f8b, #8a4fff);
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 6px 18px rgba(138,79,255,0.45);
  }
  .chip .emoji { font-size: 20px; }
  .chip .meta { font-size: 10px; opacity: 0.75; font-weight: 500; }

  textarea {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: #f0e9ff;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 90px;
    line-height: 1.4;
  }
  textarea:focus {
    outline: none;
    border-color: #ff4f8b;
    box-shadow: 0 0 0 2px rgba(255,79,139,0.2);
  }

  .row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .preset {
    flex: 1 1 auto;
    background: rgba(255,255,255,0.08);
    border: none;
    color: #f0e9ff;
    padding: 8px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .preset:active { transform: scale(0.95); }

  .stage {
    background: linear-gradient(180deg, rgba(255,79,139,0.12), rgba(79,195,255,0.12));
    border-radius: 18px;
    padding: 18px 14px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    min-height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .stage .who {
    font-size: 14px;
    font-weight: 700;
    opacity: 0.85;
  }
  .stage .who .small { font-size: 11px; opacity: 0.7; font-weight: 500; }
  .lyric {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.3;
    min-height: 24px;
  }
  .lyric .syl {
    display: inline-block;
    transition: transform 0.15s ease, color 0.15s ease;
    margin: 0 1px;
  }
  .lyric .syl.on {
    color: #ffd84a;
    transform: translateY(-6px) scale(1.15);
    text-shadow: 0 4px 14px rgba(255,216,74,0.6);
  }

  .bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 30px;
  }
  .bar {
    width: 4px;
    background: linear-gradient(180deg, #ff4f8b, #4fc3ff);
    border-radius: 2px;
    height: 4px;
    transition: height 0.1s ease;
  }
  .bars.on .bar { animation: dance 0.6s infinite alternate; }
  .bars.on .bar:nth-child(2) { animation-delay: 0.1s; }
  .bars.on .bar:nth-child(3) { animation-delay: 0.2s; }
  .bars.on .bar:nth-child(4) { animation-delay: 0.05s; }
  .bars.on .bar:nth-child(5) { animation-delay: 0.15s; }
  @keyframes dance { to { height: 28px; } }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, #0d0820 40%);
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  footer > * { pointer-events: auto; }
  footer .inner {
    width: 100%;
    max-width: 456px;
    display: flex;
    gap: 8px;
  }
  .btn {
    border: none;
    color: white;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 800;
    border-radius: 999px;
    cursor: pointer;
    flex: 1;
    box-shadow: 0 8px 22px rgba(138, 79, 255, 0.45);
    transition: transform 0.12s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn.sing {
    background: linear-gradient(90deg, #ff4f8b, #8a4fff);
  }
  .btn.stop {
    background: rgba(255,255,255,0.1);
    color: #f0e9ff;
    box-shadow: none;
    flex: 0 0 80px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .toast {
    position: fixed;
    bottom: 84px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    color: #0d0820;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎤 ZING-O-MATIC</h1>
    <p>Kies een artiest, een tekst en een genre</p>
  </header>

  <main>
    <section class="card">
      <div class="label">1. Artiest</div>
      <div class="h-scroll" id="artists"></div>
    </section>

    <section class="card">
      <div class="label">2. Genre</div>
      <div class="h-scroll" id="genres"></div>
    </section>

    <section class="card">
      <div class="label">3. Tekst</div>
      <textarea id="lyrics" placeholder="Schrijf hier de songtekst die de artiest moet zingen..." maxlength="400">De zon schijnt door het raam, ik zing een lied voor jou</textarea>
      <div class="row">
        <button class="preset" data-text="De zon schijnt door het raam, ik zing een lied voor jou">☀️ Zonnig</button>
        <button class="preset" data-text="Tranen vallen in de regen, mijn hart is leeg vannacht">💔 Verdriet</button>
        <button class="preset" data-text="Yo, check the rhythm, ik ben de beste in de game">🎧 Stoer</button>
        <button class="preset" data-text="Dansen tot de zon opkomt, vannacht is van ons">🪩 Feest</button>
      </div>
    </section>

    <section class="stage">
      <div class="who" id="who">Selecteer een artiest & genre</div>
      <div class="lyric" id="lyric">🎶 ... 🎶</div>
      <div class="bars" id="bars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="inner">
      <button class="btn sing" id="singBtn">🎤 Laat zingen</button>
      <button class="btn stop" id="stopBtn">⏹</button>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
</div>

<script>
  // ---------- ARTISTS ----------
  // gender: used for voice selection. pitch is base pitch offset, rate is base rate.
  const artists = [
    { id: 'adele',    name: 'Adele',         emoji: '🎙️', gender: 'female', pitch: 0.85, rate: 0.85, lang: 'en-GB', meta: 'Soulful' },
    { id: 'beyonce',  name: 'Beyoncé',       emoji: '👑', gender: 'female', pitch: 1.15, rate: 1.0,  lang: 'en-US', meta: 'Diva power' },
    { id: 'taylor',   name: 'Taylor Swift',  emoji: '✨', gender: 'female', pitch: 1.05, rate: 1.05, lang: 'en-US', meta: 'Pop sweet' },
    { id: 'sheeran',  name: 'Ed Sheeran',    emoji: '🎸', gender: 'male',   pitch: 1.0,  rate: 1.0,  lang: 'en-GB', meta: 'Akoestisch' },
    { id: 'drake',    name: 'Drake',         emoji: '🦉', gender: 'male',   pitch: 0.75, rate: 0.95, lang: 'en-US', meta: 'Smooth flow' },
    { id: 'eminem',   name: 'Eminem',        emoji: '🔥', gender: 'male',   pitch: 0.9,  rate: 1.4,  lang: 'en-US', meta: 'Snel & scherp' },
    { id: 'hazes',    name: 'André Hazes',   emoji: '🍻', gender: 'male',   pitch: 0.7,  rate: 0.85, lang: 'nl-NL', meta: 'Levenslied' },
    { id: 'borsato',  name: 'Marco Borsato', emoji: '❤️', gender: 'male',   pitch: 0.85, rate: 0.9,  lang: 'nl-NL', meta: 'Smartlap' },
    { id: 'aguilera', name: 'Christina A.',  emoji: '💖', gender: 'female', pitch: 1.3,  rate: 0.95, lang: 'en-US', meta: 'Hoge noten' },
    { id: 'cash',     name: 'Johnny Cash',   emoji: '🤠', gender: 'male',   pitch: 0.55, rate: 0.8,  lang: 'en-US', meta: 'Diepe stem' },
  ];

  // ---------- GENRES ----------
  // melody: array of pitch multipliers cycled per syllable.
  // rateMul: multiplier on artist rate. pause: ms between syllables.
  const genres = [
    { id: 'pop',     name: 'Pop',     emoji: '🎵', melody: [1.0, 1.1, 1.05, 1.15, 1.0, 0.95], rateMul: 1.0,  pause: 90,  meta: 'Vrolijk' },
    { id: 'rock',    name: 'Rock',    emoji: '🎸', melody: [0.9, 1.0, 0.85, 0.95, 1.1, 0.9],  rateMul: 1.05, pause: 70,  meta: 'Stevig' },
    { id: 'opera',   name: 'Opera',   emoji: '🎭', melody: [1.2, 1.4, 1.3, 1.5, 1.25, 1.1],   rateMul: 0.6,  pause: 220, meta: 'Dramatisch' },
    { id: 'rap',     name: 'Rap',     emoji: '🎤', melody: [0.95, 0.9, 1.0, 0.95],            rateMul: 1.6,  pause: 30,  meta: 'Spitting' },
    { id: 'ballad',  name: 'Ballad',  emoji: '🕯️', melody: [0.95, 1.05, 1.0, 1.1, 0.9, 0.85], rateMul: 0.7,  pause: 180, meta: 'Emotioneel' },
    { id: 'techno',  name: 'Techno',  emoji: '🤖', melody: [1.0, 1.0, 1.05, 1.0, 0.95, 1.0],  rateMul: 1.3,  pause: 50,  meta: 'Hypnotisch' },
    { id: 'reggae',  name: 'Reggae',  emoji: '🌴', melody: [1.0, 0.95, 1.05, 0.9, 1.0, 0.95], rateMul: 0.85, pause: 140, meta: 'Chillax' },
    { id: 'country', name: 'Country', emoji: '🤠', melody: [0.95, 1.05, 1.1, 0.95, 1.0, 0.9], rateMul: 0.9,  pause: 120, meta: 'Twangy' },
    { id: 'jazz',    name: 'Jazz',    emoji: '🎷', melody: [1.0, 1.1, 0.85, 1.05, 0.9, 1.15], rateMul: 0.95, pause: 130, meta: 'Smooth' },
    { id: 'kinder',  name: 'Kinder',  emoji: '🧸', melody: [1.2, 1.3, 1.4, 1.3, 1.2, 1.35],   rateMul: 1.1,  pause: 100, meta: 'Vrolijk hoog' },
  ];

  // ---------- STATE ----------
  let selectedArtist = artists[0];
  let selectedGenre = genres[0];
  let voices = [];
  let isSinging = false;

  // ---------- VOICES ----------
  function loadVoices() {
    voices = window.speechSynthesis.getVoices();
  }
  if (typeof speechSynthesis !== 'undefined') {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoice(artist) {
    if (!voices.length) return null;
    // Prefer matching language + gender hint in name.
    const langMatches = voices.filter(v => v.lang.startsWith(artist.lang.split('-')[0]));
    const genderHints = artist.gender === 'female'
      ? ['female', 'woman', 'samantha', 'victoria', 'karen', 'tessa', 'fiona', 'moira', 'ellen', 'xander']
      : ['male', 'man', 'daniel', 'alex', 'fred', 'oliver', 'thomas', 'rishi'];
    const pool = langMatches.length ? langMatches : voices;
    const matched = pool.find(v => genderHints.some(h => v.name.toLowerCase().includes(h)));
    return matched || pool[0] || voices[0];
  }

  // ---------- DOM ----------
  const $ = (s) => document.querySelector(s);
  const artistsEl = $('#artists');
  const genresEl = $('#genres');
  const lyricsEl = $('#lyrics');
  const whoEl = $('#who');
  const lyricEl = $('#lyric');
  const barsEl = $('#bars');

  function renderArtists() {
    artistsEl.innerHTML = '';
    artists.forEach(a => {
      const c = document.createElement('button');
      c.className = 'chip' + (a.id === selectedArtist.id ? ' active' : '');
      c.innerHTML = `<span class="emoji">${a.emoji}</span><div><div>${a.name}</div><div class="meta">${a.meta}</div></div>`;
      c.onclick = () => { selectedArtist = a; renderArtists(); updateWho(); };
      artistsEl.appendChild(c);
    });
  }

  function renderGenres() {
    genresEl.innerHTML = '';
    genres.forEach(g => {
      const c = document.createElement('button');
      c.className = 'chip' + (g.id === selectedGenre.id ? ' active' : '');
      c.innerHTML = `<span class="emoji">${g.emoji}</span><div><div>${g.name}</div><div class="meta">${g.meta}</div></div>`;
      c.onclick = () => { selectedGenre = g; renderGenres(); updateWho(); };
      genresEl.appendChild(c);
    });
  }

  function updateWho() {
    whoEl.innerHTML = `${selectedArtist.emoji} <b>${selectedArtist.name}</b> <span class="small">zingt in</span> ${selectedGenre.emoji} <b>${selectedGenre.name}</b>`;
  }

  function toast(m) {
    const t = $('#toast');
    t.textContent = m;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 1500);
  }

  // ---------- SING ----------
  function syllabify(text) {
    // Word-level syllabification: split each word on vowel groups.
    const words = text.trim().split(/\s+/);
    const result = [];
    words.forEach((w, wi) => {
      const parts = w.match(/[^aeiouyAEIOUY]*[aeiouyAEIOUY]+(?:[^aeiouyAEIOUY]*$|[^aeiouyAEIOUY](?=[^aeiouyAEIOUY]))?/g);
      const sylls = (parts && parts.length) ? parts : [w];
      sylls.forEach((s, si) => {
        result.push({ text: s, isLast: si === sylls.length - 1, wordIndex: wi });
      });
    });
    return result;
  }

  function renderLyric(syllables) {
    lyricEl.innerHTML = '';
    let lastWord = -1;
    syllables.forEach((s, i) => {
      if (s.wordIndex !== lastWord && lastWord !== -1) {
        lyricEl.appendChild(document.createTextNode(' '));
      }
      lastWord = s.wordIndex;
      const span = document.createElement('span');
      span.className = 'syl';
      span.dataset.idx = i;
      span.textContent = s.text;
      lyricEl.appendChild(span);
    });
  }

  function highlightSyllable(idx) {
    document.querySelectorAll('.syl').forEach(el => el.classList.remove('on'));
    const el = document.querySelector(`.syl[data-idx="${idx}"]`);
    if (el) el.classList.add('on');
  }

  function sing() {
    if (!('speechSynthesis' in window)) {
      toast('Spraak niet ondersteund 😔');
      return;
    }
    const text = lyricsEl.value.trim();
    if (!text) { toast('Schrijf eerst een tekst!'); return; }

    speechSynthesis.cancel();
    if (!voices.length) loadVoices();

    const syllables = syllabify(text);
    if (!syllables.length) return;
    renderLyric(syllables);
    barsEl.classList.add('on');
    isSinging = true;

    const voice = pickVoice(selectedArtist);
    const melody = selectedGenre.melody;
    let i = 0;

    const speakNext = () => {
      if (!isSinging || i >= syllables.length) {
        isSinging = false;
        barsEl.classList.remove('on');
        document.querySelectorAll('.syl').forEach(el => el.classList.remove('on'));
        return;
      }
      const s = syllables[i];
      const u = new SpeechSynthesisUtterance(s.text);
      if (voice) u.voice = voice;
      u.lang = selectedArtist.lang;
      const melodyMul = melody[i % melody.length];
      u.pitch = Math.max(0.1, Math.min(2, selectedArtist.pitch * melodyMul));
      u.rate = Math.max(0.1, Math.min(3, selectedArtist.rate * selectedGenre.rateMul));
      u.volume = 1;

      highlightSyllable(i);

      u.onend = () => {
        i++;
        const pauseMs = s.isLast ? selectedGenre.pause * 2 : selectedGenre.pause;
        setTimeout(speakNext, pauseMs);
      };
      u.onerror = () => {
        i++;
        setTimeout(speakNext, 50);
      };
      speechSynthesis.speak(u);
    };
    speakNext();
  }

  function stop() {
    isSinging = false;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    barsEl.classList.remove('on');
    document.querySelectorAll('.syl').forEach(el => el.classList.remove('on'));
  }

  // ---------- EVENTS ----------
  $('#singBtn').onclick = sing;
  $('#stopBtn').onclick = stop;

  document.querySelectorAll('.preset').forEach(p => {
    p.onclick = () => { lyricsEl.value = p.dataset.text; };
  });

  // ---------- INIT ----------
  renderArtists();
  renderGenres();
  updateWho();
</script>
</body>
</html>
